name: DXY Zona Support/Resisten (tiap jam)

on:
  schedule:
    - cron: '17 * * * *' # geser dikit dari jam bulat, pola sama kayak workflow lain di repo ini
  workflow_dispatch: {}

concurrency:
  group: dxy-zone-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      - name: Cek zona DXY (dxyZoneMonitor.js)
        run: node dxyZoneMonitor.js

      - name: Commit & push dxy-zone-state.json + archive.json (WAJIB tiap run)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          for f in dxy-zone-state.json archive.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --staged --quiet || git commit -m "Auto: zona DXY $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push dxy-zone-state.json setelah 5x percobaan."
          exit 1

      - name: Purge jsDelivr cache
        if: success()
        run: curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/archive.json" || true
