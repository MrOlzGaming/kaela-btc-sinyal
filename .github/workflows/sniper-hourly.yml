name: Monitor Order Sniper (tiap jam)

# 4 Sep 2026 -- jadwal `schedule:` DIMATIIN (dibuktikan audit: GitHub Actions kebukti jalan tiap
# 2-4 jam nyata, bukan tiap jam kayak cron-nya, gara-gara antrian akun ini padat -- notif TP/SL
# kena bisa telat berjam-jam). Eksekusi PENUH dipindah ke run-vultr-executor.sh (VPS, cron beneran
# reliable tiap 15 menit) -- lihat catatan di sana. workflow_dispatch DIBIARIN buat trigger manual
# darurat doang (mis. VPS lagi down), JANGAN diaktifin lagi jadi jadwal otomatis tanpa
# koordinasi -- resiko 2 sumber eksekusi bareng trigger/close + kirim WA dobel (lihat comment
# concurrency di bawah, sniperOrderMonitor.js gak punya dedup se-robust price-alert/dxy-zone).
on:
  workflow_dispatch: {}

# Cegah 2 run tumpang tindih -- kalau bareng, dua-duanya bisa liat order PENDING/FLOATING yang
# sama dan sama-sama trigger/close + kirim WA 2x. Lihat whale-alert.yml buat kasus nyata bug ini.
concurrency:
  group: sniper-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
            FONNTE_BROADCAST_GROUPS: ['${{ secrets.FONNTE_GROUP_ID }}', '${{ secrets.FONNTE_GROUP_ID_FAM }}'],
          };
          EOF

      - name: Pantau order Sniper MANUAL (sniperOrderMonitor.js) -- BUKAN auto-decide entry
        run: node sniperOrderMonitor.js

      # 15 Agu 2026: buildDashboard.js DICABUT dari sini -- web/index.html sekarang shell statis
      # yang gak nyimpen data (lihat buildDashboard.js), jadi gak pernah butuh di-rebuild tiap
      # data berubah. Pengunjung dapet data terbaru LANGSUNG dari archive.json/sniper-orders.json
      # di bawah ini (fetch client-side, lihat web/js/dashboard-load.js) -- BUKAN dari HTML yang
      # di-generate ulang. Commit di sini CUKUP, gak perlu apa-apa lagi buat web keliatan fresh.
      - name: Commit & push archive.json + sniper-orders.json (WAJIB tiap run kalau ada perubahan)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          # kaela-bankroll.json WAJIB ikut (21 Agu 2026, bug KRITIS ketemu): sniperOrderMonitor.js
          # manggil applyRealizedPnl() (partial TP/close) yang nulis file ini juga -- kalau gak
          # ikut di-add, dia jadi PERUBAHAN GAK KE-STAGE pas commit, bikin `git pull --rebase`
          # abis commit SELALU gagal ("cannot pull with rebase: you have unstaged changes"),
          # push retry 5x gagal semua, sniper-orders.json (termasuk partialDone:true) GAK PERNAH
          # nyampe remote. Run berikutnya checkout ulang state LAMA (partialDone masih false),
          # deteksi ulang target tahap 1 "kena" lagi, kirim WA "TARGET TAHAP 1 KENA" LAGI -- infinite
          # loop WA duplikat sampai kapanpun tanpa fix ini (ketemu dari laporan Olan: WA "jual
          # separuh" kekirim berkali-kali tapi posisi beneran gak pernah keupdate).
          for f in archive.json sniper-orders.json kaela-bankroll.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --staged --quiet || git commit -m "Auto: sniper order monitor $(date -u +%Y-%m-%dT%H:%M)"
          # Retry pull+push -- kalau push gagal dan gak diulang, sniper-orders.json GAK MAJU,
          # run berikutnya bisa anggap order yang UDAH ditrigger/ditutup sebagai belum, kirim WA
          # duplikat trigger/close. Lihat whale-alert.yml buat kasus nyata bug sejenis.
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push sniper-orders.json setelah 5x percobaan."
          exit 1

      # Purge jsDelivr (17 Agu 2026) -- lihat catatan sama di daily-report.yml/sniper-daily-trigger.yml.
      - name: Purge jsDelivr cache
        if: success()
        run: |
          for f in archive.json sniper-orders.json kaela-bankroll.json; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/$f" || true
          done
