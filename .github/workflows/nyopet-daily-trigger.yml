name: Nyopet Market - Trigger Analisa Harian

on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC = 08:05 WITA, abis candle Daily closed (08:00 WITA)
  workflow_dispatch: {}

concurrency:
  group: nyopet-daily-trigger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      # BUKAN sinyal, gak nyentuh web/archive sama sekali (konsisten kebijakan "belum valid
      # gak tampil dimanapun") -- makanya gak ada langkah rebuild/deploy Netlify di sini.
      - name: Kirim heartbeat + ajakan analisa (nyopetDailyTrigger.js)
        run: node nyopetDailyTrigger.js

      - name: Commit & push nyopet-trigger-state.json (dedup harian, WAJIB biar gak dobel kirim)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f nyopet-trigger-state.json
          git diff --staged --quiet || git commit -m "Auto: nyopet daily trigger $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin master
          git push
