name: Laporan Harian (Siklus Halving + Grup WA)

on:
  schedule:
    # 23:03 (bukan 23:00 persis) -- mitigasi delay jadwal jam bulat, lihat news-daily.yml.
    - cron: '3 23 * * *' # 23:03 UTC = 07:03 WITA (hari berikutnya)
  workflow_dispatch: {}

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # secrets.js gitignored di repo -- ditulis ulang tiap run dari GitHub Actions Secrets
      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
            FONNTE_BROADCAST_GROUPS: ['${{ secrets.FONNTE_GROUP_ID }}', '${{ secrets.FONNTE_GROUP_ID_FAM }}'],
          };
          EOF

      - name: Laporan pribadi Olan (monitor.js)
        run: node monitor.js

      - name: Laporan grup WA (groupMonitor.js)
        run: node groupMonitor.js

      # econCalendarMonitor.js DIPINDAH ke workflow sendiri (econ-calendar.yml, tiap 6 jam) --
      # 22 Agu 2026, fix bug event dini hari WITA (misal FOMC) kelewat karena cuma dicek 1x/hari
      # di sini. Lihat catatan lengkap di econCalendarMonitor.js.

      # 15 Agu 2026: buildDashboard.js DICABUT -- state.json difetch LANGSUNG di browser
      # pengunjung (web/js/dashboard-load.js), jadi commit di bawah ini aja udah cukup buat
      # panel Musiman keupdate, gak perlu rebuild/deploy HTML apapun.
      - name: Commit & push state/archive (persist di git, satu-satunya storage yang tahan di CI)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          for f in state.json archive.json conviction-track-record.json analyst-dashboard.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --staged --quiet || git commit -m "Auto: laporan harian $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push setelah 5x percobaan."
          exit 1

      # Purge jsDelivr (17 Agu 2026) -- web fetch data lewat jsDelivr (raw.githubusercontent kena
      # rate-limit HTTP 429), CDN-nya cache ~12 jam kalau gak dipaksa refresh tiap ada data baru.
      - name: Purge jsDelivr cache
        if: success()
        run: |
          for f in state.json archive.json analyst-dashboard.json; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/$f" || true
          done
