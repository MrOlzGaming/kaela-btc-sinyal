name: Deploy Kaela Access - Masking Site (manual)

# 25 Agu 2026 -- masking/index.html (APPS/kaela-multi-akun/masking/, di komputer Olan) itu
# TIDAK ada di git repo manapun (folder lokal murni), dan Netlify CLI di komputer Olan login ke
# akun "Toko Prestasi" yang gak punya akses ke site kaela-access (site_id beda, kepunyaan akun
# lain). Solusinya: pakai jalur yang SUDAH kebukti kerja -- secrets.NETLIFY_AUTH_TOKEN yang sama
# kayak dipakai deploy-daily.yml (repo ini), TAPI target site-nya kaela-access (bukan
# kaela-btc-sinyal).
#
# Konten index.html DITULIS INLINE (base64, 1 baris) -- bukan checkout dari lokal Olan (itu gak
# keliatan dari GitHub Actions). BUG KETEMU di percobaan pertama: heredoc HTML multi-baris TANPA
# indentasi di dalam block scalar YAML `run: |` bikin YAML nganggep scalar-nya SELESAI begitu
# ketemu baris kurang indentasi -> sisanya (HTML) dicoba diparse sbg YAML baru -> rusak total,
# GitHub gagal baca `on: workflow_dispatch`. Fix: base64 1 baris (gak ada masalah indentasi sama
# sekali), didekode balik jadi HTML pas run.
#
# ⚠️ UPDATE BESAR 4 Sep 2026: file ini SEKARANG BUKAN lagi thin iframe-wrapper -- isinya FULL
# `web/dashboard.html` (APPS/kaela-multi-akun/) dengan placeholder `__GAS_URL__` diganti URL exec
# literal. Perubahan ini fix akar masalah "Exception: Konten HTML rusak" (Malformed HTML content)
# yang intermiten dari GAS HtmlService.createHtmlOutputFromFile -- root cause TERNYATA bukan soal
# 1 baris/tag spesifik, tapi GAS HtmlService-nya sendiri gak stabil buat nyajiin HTML gede/kompleks
# (lihat memori project-kaela-multi-akun.md). Solusi TUNTAS: dashboard di-host statis di Netlify
# (jalur ini, reliable, gak ada sanitizer buggy), GAS CUMA jadi backend API (endpoint aksi=X, semua
# ContentService yang TERBUKTI reliable) + jalur `aksi=appjs` (ContentService juga) buat JS besar
# (dipisah ke AppJs.gs biar dashboard.html ringan). GAS `page=dashboard` (Main.gs _sajikanDashboard)
# DIBIARIN ada sbg fallback lama, TAPI TIDAK DIPAKAI LAGI SEBAGAI JALUR UTAMA.
#
# Update workflow ini tiap kali web/dashboard.html ATAU masking/index.html berubah -- regenerate
# base64: (1) copy web/dashboard.html, ganti SEMUA `__GAS_URL__` jadi URL exec literal, simpen ke
# masking/index.html, (2) `base64 -w0 "APPS/kaela-multi-akun/masking/index.html"` -> tempel ke
# baris di antara `base64 -d > masking-site/index.html <<'B64EOF'` dan `B64EOF` di step "Tulis
# index.html" (1 baris, gak perlu indentasi khusus -- lihat komentar di step-nya soal kenapa
# base64 hidup di badan heredoc, BUKAN `env:` lagi).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 6 Sep 2026 -- KETEMU BUG BARU: base64 gede (masking/index.html udah ~100KB+) sbg step-level
      # `env:` var bikin runner gagal spawn bash ("Argument list too long") -- OS execve() ARG_MAX
      # kena limit begitu base64 (~135KB) numpuk di environment proses. FIX: base64 dipindah dari
      # env var ke BADAN SCRIPT langsung via heredoc (`base64 -d <<'B64EOF'`) -- script file gak kena batas ARG_MAX,
      # cuma env var yg kena. Base64 TETAP 1 baris (alasan indentasi YAML lama, lihat komentar atas).
      - name: Tulis index.html (dari base64)
        run: |
          mkdir -p masking-site
          base64 -d > masking-site/index.html <<'B64EOF'
          
          B64EOF
          cat masking-site/index.html

      - name: Deploy ke Netlify (site kaela-access)
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=masking-site --prod --site "cdb40300-4ea1-403c-99da-2ce2cf3e4200" --auth "${{ secrets.NETLIFY_AUTH_TOKEN }}"
