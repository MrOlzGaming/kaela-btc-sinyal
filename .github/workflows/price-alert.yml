name: Price Alert BTC (tiap 5 menit)

on:
  # ⛔ Schedule DIMATIIN 8 Sep 2026 -- pola race SAMA kayak news-pagi.yml (INSIDEN NYATA hari ini:
  # berita dobel kirim gara-gara push state-file GH Actions kalah race sama commit Vultr).
  # priceAlertMonitor.js JUGA dijalanin Vultr tiap 15 menit (run-vultr-executor.sh) DAN JUGA
  # commit+push price-alert-state.json sendiri -- resiko dedup race identik, malah lebih rawan
  # (cron 5 menit = commit jauh lebih sering ketimbang yang lain). Vultr udah cover ini secara
  # handal. workflow_dispatch dibiarin buat manual/tes.
  workflow_dispatch: {}

concurrency:
  group: price-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
            FONNTE_BROADCAST_GROUPS: ['${{ secrets.FONNTE_GROUP_ID }}', '${{ secrets.FONNTE_GROUP_ID_FAM }}'],
          };
          EOF

      - name: Cek pergerakan harga mendadak (priceAlertMonitor.js)
        run: node priceAlertMonitor.js

      - name: Commit & push price-alert-state.json (WAJIB tiap run)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          for f in price-alert-state.json archive.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --staged --quiet || git commit -m "Auto: price alert monitor $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push price-alert-state.json setelah 5x percobaan."
          exit 1

      # Purge jsDelivr (17 Agu 2026) -- lihat catatan sama di daily-report.yml/sniper-daily-trigger.yml.
      - name: Purge jsDelivr cache
        if: success()
        run: curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/archive.json" || true
