name: Deploy web/ ke Cloudflare Pages (manual)

# Diubah TOTAL 15 Agu 2026, 2 tahap:
#   Tahap 1: dari "tiap push" (dobel-triple sama step deploy tiap workflow rutin) jadi 1x/hari
#   terjadwal -- itu MASIH nyimpen bug konsep ("ngetik ulang lalu deploy" cuma dikurangin
#   frekuensinya, bukan dihilangin akarnya).
#   Tahap 2 (final, permintaan Olan: "rumus bro rumus, bukan deploy deploy an"): arsitektur
#   diubah TOTAL -- web/index.html & web/jurnal.html sekarang SHELL STATIS doang (lihat
#   buildDashboard.js), SEMUA konten dinamis (sinyal/posisi/DCA/jurnal) di-fetch+render
#   LANGSUNG DI BROWSER pengunjung dari data JSON di repo publik (lihat web/js/kaela-render.js,
#   dashboard-load.js, jurnal-load.js) -- GRATIS, real-time, ZERO kredit Netlify. Cron rutin
#   (sniper-hourly/daily-trigger, whale/news/laporan) SEKARANG CUMA commit data ke git, gak ada
#   satupun yang nyentuh web/*.html atau manggil buildDashboard.js lagi.
#
# Konsekuensinya: shell HTML PRAKTIS TIDAK PERNAH BERUBAH dari aktivitas rutin apapun -- jadi
# gak ada lagi alasan buat jadwal deploy otomatis SAMA SEKALI. Workflow ini SEKARANG MURNI
# MANUAL (workflow_dispatch) -- dipicu Kaela sendiri HANYA begitu ada perubahan TAMPILAN/STRUKTUR
# shell beneran (edit buildDashboard.js, CSS, dst), bukan buat data rutin apapun.
#
# 26 Okt 2026: Pindah dari Netlify ke Cloudflare Pages (Netlify BLACKLISTED).
# Perlu secrets GitHub: CF_API_TOKEN + CF_ACCOUNT_ID
# Nama proyek CF Pages: kaela-trader-web → URL: https://kaela-trader-web.pages.dev

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-daily
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy web/ ke Cloudflare Pages
        run: npx wrangler@3 pages deploy web --project-name kaela-trader-web --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
