name: Kaela News (Siang)

on:
  # ⛔ Schedule DIMATIIN 8 Sep 2026 -- pola sama kayak news-pagi.yml (lihat catatan di sana):
  # dobel-kirim ketauan hari ini gara-gara push archive.json race sama commit Vultr. Vultr
  # (runDueNews.js, tiap 15 menit) udah cover slot ini. workflow_dispatch dibiarin buat manual/tes.
  workflow_dispatch: {}

concurrency:
  group: news-siang
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
            FONNTE_BROADCAST_GROUPS: ['${{ secrets.FONNTE_GROUP_ID }}', '${{ secrets.FONNTE_GROUP_ID_FAM }}'],
          };
          EOF

      - name: Cari & kirim berita edisi Siang (newsMonitor.js)
        run: node newsMonitor.js siang

      - name: Commit & push archive
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f archive.json
          git diff --staged --quiet || git commit -m "Auto: berita siang $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push setelah 5x percobaan."
          exit 1

      - name: Purge jsDelivr cache
        if: success()
        run: curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/archive.json" || true
