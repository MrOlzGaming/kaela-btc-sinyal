name: Sniper - Trigger Analisa Harian

on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC = 08:05 WITA, abis candle Daily closed (08:00 WITA)
  workflow_dispatch: {}

concurrency:
  group: sniper-daily-trigger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # WAJIB >=22 -- sniperAutoAnalysis.js pakai WebSocket bawaan Node (sampleLiquidations()),
          # baru stabil tanpa flag mulai Node 22. Ketauan 12 Agu 2026: workflow gagal 2 hari
          # berturut-turut ("WebSocket is not defined") gara-gara masih di Node 20.
          node-version: '22'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      # Analisa gabungan OTOMATIS (teknikal + liquidation heatmap) -> VALID buka posisi
      # BAYANGAN (sniperAutoAnalysis.js, keputusan Olan 9 Agu 2026) / INVALID kirim status.
      - name: Analisa gabungan otomatis (sniperAutoAnalysis.js)
        run: node sniperAutoAnalysis.js

      # DCA Spot Musiman BAYANGAN (15 Agu 2026, permintaan Olan) -- $2/hari selama window Tanam
      # sampai halving, jual semua pas Panen. TANPA WA sama sekali (spotDca.js gak pernah impor
      # fonnte.js) -- murni tercatat ke kaela-spot.json, ditampilkan di tab Spot halaman Jurnal.
      - name: DCA Spot Musiman (spotDca.js)
        run: node spotDca.js

      # 15 Agu 2026: buildDashboard.js DICABUT -- web/*.html shell statis, gak butuh rebuild
      # tiap data berubah. Pengunjung fetch data terbaru langsung dari file JSON di bawah ini
      # (client-side, lihat web/js/jurnal-load.js/dashboard-load.js) -- commit aja udah cukup.
      - name: Commit & push (WAJIB tiap run, biar dedup harian gak lupa)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f sniper-trigger-state.json archive.json sniper-orders.json kaela-spot.json
          git diff --staged --quiet || git commit -m "Auto: sniper analisa harian $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push setelah 5x percobaan."
          exit 1

      # Purge jsDelivr (17 Agu 2026) -- web fetch data lewat jsDelivr (raw.githubusercontent kena
      # rate-limit HTTP 429), CDN-nya cache ~12 jam kalau gak dipaksa refresh tiap ada data baru.
      - name: Purge jsDelivr cache
        if: success()
        run: |
          for f in sniper-trigger-state.json archive.json sniper-orders.json kaela-spot.json kaela-bankroll.json; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/$f" || true
          done
