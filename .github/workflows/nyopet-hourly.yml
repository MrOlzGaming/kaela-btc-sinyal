name: Monitor Order Nyopet Market (tiap jam)

on:
  schedule:
    - cron: '5 * * * *' # menit ke-5 tiap jam -- buffer biar candle hourly Binance udah pasti closed
  workflow_dispatch: {}

# Cegah 2 run tumpang tindih -- kalau bareng, dua-duanya bisa liat order PENDING/FLOATING yang
# sama dan sama-sama trigger/close + kirim WA 2x. Lihat whale-alert.yml buat kasus nyata bug ini.
concurrency:
  group: nyopet-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      - name: Pantau order Nyopet Market MANUAL (nyopetOrderMonitor.js) -- BUKAN auto-decide entry
        run: node nyopetOrderMonitor.js

      - name: Cek apakah ada event/status baru (archive.json atau nyopet-orders.json berubah)
        id: check
        run: |
          if git diff --quiet archive.json nyopet-orders.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild web/index.html (cuma kalau ada perubahan)
        if: steps.check.outputs.changed == 'true'
        run: node buildDashboard.js

      - name: Commit & push archive.json + nyopet-orders.json (WAJIB tiap run kalau ada perubahan)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f archive.json nyopet-orders.json web/index.html
          git diff --staged --quiet || git commit -m "Auto: nyopet order monitor $(date -u +%Y-%m-%dT%H:%M)"
          # Retry pull+push -- kalau push gagal dan gak diulang, nyopet-orders.json GAK MAJU,
          # run berikutnya bisa anggap order yang UDAH ditrigger/ditutup sebagai belum, kirim WA
          # duplikat trigger/close. Lihat whale-alert.yml buat kasus nyata bug sejenis.
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push nyopet-orders.json setelah 5x percobaan."
          exit 1

      - name: Deploy web/ ke Netlify (cuma kalau ada perubahan, hemat build minutes)
        if: steps.check.outputs.changed == 'true'
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=web --prod --site "${{ secrets.NETLIFY_SITE_ID }}" --auth "${{ secrets.NETLIFY_AUTH_TOKEN }}"
