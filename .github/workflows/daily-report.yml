name: Laporan Harian (Siklus Halving + Grup WA)

on:
  schedule:
    # 23:03 (bukan 23:00 persis) -- mitigasi delay jadwal jam bulat, lihat news-daily.yml.
    - cron: '3 23 * * *' # 23:03 UTC = 07:03 WITA (hari berikutnya)
  workflow_dispatch: {}

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # secrets.js gitignored di repo -- ditulis ulang tiap run dari GitHub Actions Secrets
      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      - name: Laporan pribadi Olan (monitor.js)
        run: node monitor.js

      - name: Laporan grup WA (groupMonitor.js)
        run: node groupMonitor.js

      - name: Jadwal ekonomi hari ini (econCalendarMonitor.js)
        run: node econCalendarMonitor.js

      - name: Rebuild web/index.html dari archive terbaru
        run: node buildDashboard.js

      - name: Commit & push state/archive/web (persist di git, satu-satunya storage yang tahan di CI)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f state.json archive.json web/index.html
          git diff --staged --quiet || git commit -m "Auto: laporan harian $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push setelah 5x percobaan."
          exit 1

      # Deploy Netlify DICABUT dari sini (15 Agu 2026, kredit abis gara-gara puluhan deploy/hari) --
      # web/index.html tetap ke-rebuild+commit tiap run (di atas), tapi live site cuma keupdate
      # lewat deploy-daily.yml (1x/hari terjadwal) atau manual workflow_dispatch.
