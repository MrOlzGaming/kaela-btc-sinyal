name: DIAG geo test (sementara, hapus abis dipakai)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Test beberapa endpoint derivatif
        run: |
          echo "Runner IP:"; curl -s https://api.ipify.org; echo ""
          echo "OKX funding:"; curl -s -o /dev/null -w "%{http_code}\n" "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=9"
          echo "OKX OI:"; curl -s -o /dev/null -w "%{http_code}\n" "https://www.okx.com/api/v5/public/open-interest?instId=BTC-USDT-SWAP"
          echo "Deribit funding:"; curl -s -o /dev/null -w "%{http_code}\n" "https://www.deribit.com/api/v2/public/get_funding_rate_history?instrument_name=BTC-PERPETUAL&start_timestamp=1&end_timestamp=9999999999999"
          echo "CoinGecko derivatives:"; curl -s -o /dev/null -w "%{http_code}\n" "https://api.coingecko.com/api/v3/derivatives"
          echo "Bitget funding:"; curl -s -o /dev/null -w "%{http_code}\n" "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=usdt-futures"
          echo "Gate.io funding:"; curl -s -o /dev/null -w "%{http_code}\n" "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=BTC_USDT"
