name: Whale Alert (rekap harian)

on:
  schedule:
    # 23:20 UTC = 07:20 WITA (hari berikutnya) -- ganti dari tiap 10 menit ke 1x/hari (10 Agu 2026,
    # permintaan Olan: konfirmasi blockchain gak instan, "real-time" tiap 10 menit jadi ilusi kalau
    # network lagi padat -- rekap harian lebih jujur, gak janjiin real-time).
    - cron: '20 23 * * *'
  workflow_dispatch: {}

# Cegah 2 run tumpang tindih (kalau 1 run kelamaan, run cron berikutnya nunggu dulu, BUKAN
# jalan bareng) -- run bareng bisa baca whale-state.json yang SAMA sebelum salah satunya sempat
# commit, jadi transaksi whale yang sama ke-deteksi & ke-kirim WA 2x. Ketauan 9 Agu 2026: alert
# sama persis (tx id, jam, jumlah BTC) kekirim berulang ke grup.
concurrency:
  group: whale-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      - name: Rekap transaksi besar 24 jam terakhir (whaleDailyDigest.js)
        run: node whaleDailyDigest.js

      # 15 Agu 2026: buildDashboard.js DICABUT -- entry whale gak pernah dirender ke HTML
      # (dashboard/jurnal cuma tampilin tipe 'sniper'), jadi rebuild di sini emang gak pernah
      # ngubah apapun secara visual. Commit archive.json aja udah cukup buat jejak riwayat.
      - name: Commit & push whale-state.json (WAJIB tiap run, biar blok terakhir gak lupa)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f whale-state.json archive.json
          git diff --staged --quiet || git commit -m "Auto: whale monitor $(date -u +%Y-%m-%dT%H:%M)"
          # Retry pull+push -- kalau push gagal (misal race sama workflow lain) dan gak diulang,
          # whale-state.json GAK MAJU -- run berikutnya scan ulang blok yang SAMA dari state basi,
          # deteksi+kirim WA transaksi yang SAMA lagi (ketauan 9 Agu 2026, dobel WA). Percobaan
          # berulang lebih murah daripada gagal diam-diam dan bikin duplikat kayak gini lagi.
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya SEBELUM narik ulang -- tanpa ini,
            # begitu 1 percobaan kena conflict, SEMUA percobaan berikutnya ikut gagal identik
            # ("unmerged files") walau conflict aslinya udah gak relevan lagi (ketauan 12 Agu 2026,
            # whale-state.json gak ke-simpan gara-gara ini -> risiko whale alert dobel besoknya).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push whale-state.json setelah 5x percobaan -- state gak ke-simpan, run berikutnya bisa re-scan blok yang sama."
          exit 1

      # Purge jsDelivr (17 Agu 2026) -- lihat catatan sama di daily-report.yml/sniper-daily-trigger.yml.
      - name: Purge jsDelivr cache
        if: success()
        run: curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/archive.json" || true
