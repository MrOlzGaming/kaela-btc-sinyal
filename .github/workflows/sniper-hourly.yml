name: Monitor Order Sniper (tiap jam)

on:
  schedule:
    - cron: '5 * * * *' # menit ke-5 tiap jam -- buffer biar candle hourly Binance udah pasti closed
  workflow_dispatch: {}

# Cegah 2 run tumpang tindih -- kalau bareng, dua-duanya bisa liat order PENDING/FLOATING yang
# sama dan sama-sama trigger/close + kirim WA 2x. Lihat whale-alert.yml buat kasus nyata bug ini.
concurrency:
  group: sniper-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      - name: Pantau order Sniper MANUAL (sniperOrderMonitor.js) -- BUKAN auto-decide entry
        run: node sniperOrderMonitor.js

      # 15 Agu 2026: buildDashboard.js DICABUT dari sini -- web/index.html sekarang shell statis
      # yang gak nyimpen data (lihat buildDashboard.js), jadi gak pernah butuh di-rebuild tiap
      # data berubah. Pengunjung dapet data terbaru LANGSUNG dari archive.json/sniper-orders.json
      # di bawah ini (fetch client-side, lihat web/js/dashboard-load.js) -- BUKAN dari HTML yang
      # di-generate ulang. Commit di sini CUKUP, gak perlu apa-apa lagi buat web keliatan fresh.
      - name: Commit & push archive.json + sniper-orders.json (WAJIB tiap run kalau ada perubahan)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f archive.json sniper-orders.json
          git diff --staged --quiet || git commit -m "Auto: sniper order monitor $(date -u +%Y-%m-%dT%H:%M)"
          # Retry pull+push -- kalau push gagal dan gak diulang, sniper-orders.json GAK MAJU,
          # run berikutnya bisa anggap order yang UDAH ditrigger/ditutup sebagai belum, kirim WA
          # duplikat trigger/close. Lihat whale-alert.yml buat kasus nyata bug sejenis.
          for i in 1 2 3 4 5; do
            # Buang state rebase stuck dari percobaan sebelumnya (12 Agu 2026, fix bug whale-alert).
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push sniper-orders.json setelah 5x percobaan."
          exit 1
