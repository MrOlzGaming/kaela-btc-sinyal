name: TEST liquidation WS Bybit (sementara, buat riset Dark Kaela)

# Olan tanya (15 Agu 2026): "ada alat likuidasi lain yang bisa langsung diakses, bukan andalin
# swing swing?" -- Binance forceOrder WS udah dikonfirmasi kekunci dari IP cloud GitHub Actions
# (koneksi jalan, 0 pesan diterima). Test ini: apa Bybit "All Liquidation" WS (topik publik,
# gak butuh API key) juga kena blokir yang sama, atau beneran bisa dipakai gantiin proxy swing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test koneksi WS allLiquidation Bybit multi-symbol + ping (2 menit)
        run: |
          node -e "
          const SYMBOLS = ['BTCUSDT','ETHUSDT','SOLUSDT','DOGEUSDT','XRPUSDT','1000PEPEUSDT','SUIUSDT','ADAUSDT'];
          const ws = new WebSocket('wss://stream.bybit.com/v5/public/linear');
          let count = 0;
          let closed = false;
          let pingTimer;
          ws.onopen = () => {
            console.log('[OPEN]', new Date().toISOString());
            ws.send(JSON.stringify({ op: 'subscribe', args: SYMBOLS.map(s => 'allLiquidation.' + s) }));
            console.log('[SUB SENT]', SYMBOLS.join(','));
            pingTimer = setInterval(() => ws.send(JSON.stringify({ op: 'ping' })), 18000);
          };
          ws.onmessage = (ev) => {
            count++;
            if (count <= 10) console.log('[MSG]', count, ev.data.slice(0, 300));
          };
          ws.onerror = (e) => console.log('[ERROR]', JSON.stringify(e.message || e));
          ws.onclose = (e) => { closed = true; console.log('[CLOSE]', e.code, e.reason, new Date().toISOString()); };
          setTimeout(() => {
            clearInterval(pingTimer);
            console.log('[SUMMARY Bybit multi-symbol] total msg dalam 2 menit:', count, '| masih connected:', !closed);
            process.exit(0);
          }, 120000);
          "
