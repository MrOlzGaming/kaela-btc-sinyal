name: Dark Kaela - Monitor Zona Likuiditas (tiap 5 menit)

# LIVE sejak 15 Agu 2026 -- sempat manual-only dulu (belum ada `schedule`) buat verifikasi
# dry-run di runner asli (sukses, sinyal SHORT beneran ketemu @ $63.138 di tes, terkonfirmasi
# gak ada WA/commit yang keluar pas dry_run=true). Setelah Olan konfirmasi eksplisit siap live,
# jadwal beneran dinyalain di sini.
#
# Dipercepat dari 20 menit ke 5 menit (15 Agu 2026, komplain Olan: "sinyalmu keluar setelah
# sentuh likuiditas tinggi lalu dah terbang, ketika di buy balik arah lumayan jauh") -- dibarengi
# fix darkKaelaMonitor.js yang sekarang cek TOUCH beneran pakai candle 5 menit (bukan cuma
# "deket" di candle 1 jam). Cron lebih sering doang gak cukup kalau deteksinya masih di candle
# 1 jam -- makanya dua-duanya diubah bareng.
on:
  schedule:
    # Digeser 3 menit dari kelipatan 5 bulat -- mitigasi delay jadwal jam bulat, pola sama
    # kayak workflow lain (news-daily.yml/daily-report.yml).
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (gak beneran kirim WA, cuma log)'
        type: boolean
        default: false

concurrency:
  group: dark-kaela-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tulis secrets.js dari GitHub Secrets
        run: |
          cat > secrets.js << EOF
          module.exports = {
            FONNTE_TOKEN: '${{ secrets.FONNTE_TOKEN }}',
            FONNTE_GROUP_ID: '${{ secrets.FONNTE_GROUP_ID }}',
          };
          EOF

      - name: Cek zona likuiditas (darkKaelaMonitor.js) -- info doang, gak ada eksekusi/tracking
        env:
          # event_name dicek eksplisit -- inputs.dry_run gak ada sama sekali pas trigger schedule
          # (bukan workflow_dispatch), jangan asumsi bakal falsy dgn aman tanpa cek event dulu.
          DARK_KAELA_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: node darkKaelaMonitor.js

      # Sama kayak workflow rutin lain (15 Agu 2026, arsitektur zero-deploy) -- cuma commit data,
      # gak nyentuh web/*.html atau manggil buildDashboard.js (Dark Kaela belum punya tampilan web).
      # Dry-run gak nulis state sama sekali (lihat darkKaelaMonitor.js) jadi step ini otomatis
      # no-op kalau kebetulan run dry-run manual -- aman dijalanin apa adanya tanpa `if` tambahan.
      - name: Commit & push dark-kaela-state.json (WAJIB tiap run kalau ada perubahan)
        run: |
          git config user.name "Kaela Bot"
          git config user.email "kaela-bot@users.noreply.github.com"
          git add -f dark-kaela-state.json
          git diff --staged --quiet || git commit -m "Auto: dark kaela monitor $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin master && git push && exit 0
            echo "Push percobaan $i gagal, coba lagi dalam 5 detik..."
            sleep 5
          done
          echo "::error::Gagal push dark-kaela-state.json setelah 5x percobaan."
          exit 1
